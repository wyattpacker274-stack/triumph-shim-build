name: Deep Sign IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL to the IPA'
        required: true
        type: string

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download IPA
        id: download
        run: |
          curl -L -o app.ipa "${{ github.event.inputs.ipa_url }}"
          echo "ipa_path=app.ipa" >> $GITHUB_OUTPUT
      - name: Extract IPA
        run: |
          unzip -q "${{ steps.download.outputs.ipa_path }}" -d extracted
          APP=$(find extracted/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
      - name: Create entitlements
        run: |
          cat > ents.plist << 'EOF'
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>platform-application</key><true/>
        <key>get-task-allow</key><true/>
        <key>com.apple.private.skip-library-validation</key><true/>
    </dict>
    </plist>
    EOF
      - name: Sign all Mach-O
        run: |
          APP="${{ steps.download.outputs.app_path }}"
          MACHOS=$(find "$APP" -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1)
          for bin in $MACHOS; do
            codesign --force --options runtime --entitlements ents.plist --sign - "$bin" || exit 1
          done
      - name: Re-package
        run: |
          cd extracted && zip -r -q ../Triumph_2.134_iGameGod_DEEP_SIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: deep-signed-ipa
          path: Triumph_2.134_iGameGod_DEEP_SIGNED.ipa
