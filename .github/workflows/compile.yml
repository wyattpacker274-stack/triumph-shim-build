name: Compile Shim + TweakLoader

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile CydiaSubstrate shim + TweakLoader
      run: |
        xcrun -sdk iphoneos clang -shared -fobjc-arc \
          -framework Foundation -framework UIKit \
          -arch arm64 -miphoneos-version-min=13.0 \
          -o CydiaSubstrate CydiaSubstrate.c
        xcrun -sdk iphoneos clang -shared -fobjc-arc \
          -framework Foundation -framework UIKit \
          -arch arm64 -miphoneos-version-min=13.0 \
          -o TweakLoader.dylib TweakLoader.c
        codesign --sign - --force CydiaSubstrate || true
        codesign --sign - --force TweakLoader.dylib || true
        file CydiaSubstrate TweakLoader.dylib
    - name: Upload dylibs
      uses: actions/upload-artifact@v4
      with:
        name: shim-and-loader
        path: |
          CydiaSubstrate
          TweakLoader.dylib
        retention-days: 30
